[workspace]
resolver = "3"
members = ["crates/native-react-host", "examples/hello/src-native", "examples/npm-showcase/src-native"]

[workspace.package]
edition = "2024"
rust-version = "1.91.0"

[workspace.dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "c4cb24ffa8ccfe17c3d5f6b95cefc422d3267719" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "c4cb24ffa8ccfe17c3d5f6b95cefc422d3267719" }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "c4cb24ffa8ccfe17c3d5f6b95cefc422d3267719" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "c4cb24ffa8ccfe17c3d5f6b95cefc422d3267719" }
anyrender_vello = "0.15"
winit = "=0.31.0-beta.3"
rquickjs = { version = "0.9", features = ["bindgen"] }
serde_json = "1"